name: Patch forecast full week

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-full-week-forecast-main.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch forecast logic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/ReceiptForecastEnhancerV13.tsx')
          text = path.read_text(encoding='utf-8')
          old_start = """  const rows: ForecastRow[] = [];
  history.slots.forEach((slot) => {
    const date = projectedDate(slot, targetMonth);
    const week = weeks.find((item) => isBetween(date, item.start, item.end));
    if (!week) return;
"""
          new_start = """  const rows: ForecastRow[] = [];
  const forecastMonths = [targetMonth];
  const lastWeek = weeks[weeks.length - 1];
  if (lastWeek && monthKey(lastWeek.end) !== monthKey(targetMonth)) {
    forecastMonths.push(addMonths(targetMonth, 1));
  }
  history.slots.forEach((slot) => {
    forecastMonths.forEach((forecastMonth) => {
      const date = projectedDate(slot, forecastMonth);
      const week = weeks.find((item) => isBetween(date, item.start, item.end));
      if (!week) return;
"""
          old_end = """      actual,
    });
  });
  actuals.forEach((actual, key) => {
"""
          new_end = """      actual,
    });
    });
  });
  actuals.forEach((actual, key) => {
"""
          if old_start not in text or old_end not in text:
              raise SystemExit('Trecho esperado não encontrado; patch cancelado com segurança.')
          text = text.replace(old_start, new_start, 1).replace(old_end, new_end, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name "Lucas Prado"
          git config user.email "lcsh.prado@gmail.com"
          git add components/ReceiptForecastEnhancerV13.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Corrige previsão para considerar semana completa"
          git push origin HEAD:main
